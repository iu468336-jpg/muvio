name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Configure Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/muvio-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=muvio-release.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Build Split-ABI Release APKs
        run: flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/symbols

      - name: Rename APKs with Muvio version
        run: |
          mkdir -p dist-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-apks/muvio-v1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-apks/muvio-v1.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-apks/muvio-v1.0.0-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: muvio-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            dist-apks/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          files: |
            dist-apks/*.apk
            build/app/outputs/flutter-apk/*.apk

name: muvio
description: "Muvio — Le streaming sans limites, ouvert à tous. Lecteur et gestionnaire de médias moderne compatible addons Stremio et plugins Nuvio."
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  dio_smart_retry: ^6.0.0
  drift: ^2.22.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  path: ^1.9.0
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.1
  sqlite3_flutter_libs: ^0.5.28
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
